name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} --bin primer-scout --bin primer

      - name: Package archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="primer-scout-${{ github.ref_name }}-${{ matrix.target }}"
          bindir="target/${{ matrix.target }}/release"
          staging="$name"
          mkdir -p "$staging"
          cp LICENSE README.md "$staging/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$bindir/primer-scout.exe" "$staging/"
            cp "$bindir/primer.exe" "$staging/"
            asset="$name.zip"
            7z a -tzip "$asset" "$staging" >/dev/null
          else
            cp "$bindir/primer-scout" "$staging/"
            cp "$bindir/primer" "$staging/"
            asset="$name.tar.gz"
            tar -czf "$asset" "$staging"
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.asset }}
          fail_on_unmatched_files: true
